
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar arquivos
        run: |
          echo "Repositorio baixado com sucesso"
          find . -maxdepth 4 -type f

      - name: Avisar sobre projeto Android ausente
        run: |
          if [ ! -f gradlew ] && [ ! -f build.gradle ]; then
            echo "Projeto Android ainda precisa ser adicionado."
          fi
